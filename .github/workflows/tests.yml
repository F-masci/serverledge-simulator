name: Simulator CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --only-binary :all: numpy==2.5.5 PyYAML==6.0.3 gymnasium==1.2.2 torch==2.15.0 "ray[rllib]==2.60.1" coverage==7.17.5

      - name: Run tests with coverage
        run: |
          python -m coverage run --source=simulator,scaler,trainer --branch -m unittest discover -s tests -v
          python -m coverage report
          python -m coverage xml -o coverage.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1
          if-no-files-found: error

  mutation:
    name: Mutation Testing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install mutation testing dependencies
        run: |
          python -m pip install --only-binary :all: numpy==2.5.5 PyYAML==6.0.3 pytest==9.2.0 mutmut==3.8.1

      - name: Run mutation tests
        run: |
          mutmut run || true
          python scripts/mutation_report.py
          cat mutation-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mutation-report
          path: |
            mutation-report.json
            mutation-report.md
          retention-days: 7
          if-no-files-found: error

  sonar:
    name: SonarQube Analysis
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        uses: actions/download-artifact@v8.0.2
        with:
          name: coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

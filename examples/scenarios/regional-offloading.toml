primary_region = "edge"

[invocation]
can_offload = true

[regions.cloud]
mode = "always_succeeds"
offload_latency_s = 0.5
service_time_s = 0.375

[regions.cloud.offload_latency_by_source_s]
edge = 0.25

[[regions.edge.infrastructure.rings]]
id = "amd64"
arch = "amd64"
memory_mb = 128
cpus = 1

[[regions.edge.infrastructure.rings.nodes]]
name = "edge-1"
policy = "cloudonly"
remote_region = "cloud"

[[functions]]
name = "f"
runtime = "python314"
memory_mb = 128
cpu_demand = 1
arrival_rate = 1
service_rate = 2
first_arrival_time = 0
arrival_distribution = "deterministic"
service_distribution = "deterministic"
